[package]
name = "craftls"
version = "0.0.3+rustls.0.24.0-dev.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR ISC OR MIT"
readme = "../README.md"
description = "Craftls is a fork of Rustls with customizable ClientHello fingerprint."
homepage = "https://github.com/3andne/craftls"
repository = "https://github.com/3andne/craftls"
categories = ["network-programming", "cryptography"]
autobenches = false
autotests = false
exclude = ["src/testdata", "tests/**"]

[lib]
name = "rustls"

[features]
default = ["brotli", "log", "webpki", "zlib", "zstd"]
brotli = ["dep:brotli", "dep:brotli-decompressor"]
log = ["dep:log"]
webpki = ["dep:webpki"]
zlib = ["dep:zlib-rs"]
zstd = ["dep:zstd"]

[dependencies]
brotli = { workspace = true, optional = true }
brotli-decompressor = { workspace = true, optional = true }
hashbrown = { workspace = true, optional = true }
log = { workspace = true, optional = true }
num-bigint = { workspace = true }
# only required for no-std
once_cell = { workspace = true, features = ["std"] }
subtle = { workspace = true }
webpki = { workspace = true, optional = true }
pki-types = { workspace = true, features = ["std"] }
zeroize = { workspace = true }
zlib-rs = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
bencher = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
rcgen = { workspace = true }
rustls-test = { workspace = true, default-features = false }
time = { workspace = true }
webpki-roots = { workspace = true }

[target.'cfg(any(target_arch = "aarch64", target_arch = "x86_64"))'.dev-dependencies]
graviola = { workspace = true }

[[example]]
name = "test_ca"
path = "examples/internal/test_ca.rs"

[package.metadata.docs.rs]
# all non-default features except fips (cannot build on docs.rs environment)
features = ["brotli", "hashbrown", "log", "std", "zlib", "zstd"]
rustdoc-args = ["--cfg", "rustls_docsrs"]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
  # ---
  "rustls_pki_types",
  "rustls_pki_types::*",
]

[package.metadata.cargo-semver-checks.lints]
enum_no_repr_variant_discriminant_changed = "warn"

[lints]
workspace = true
