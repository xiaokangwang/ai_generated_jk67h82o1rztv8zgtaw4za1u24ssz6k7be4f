[package]
name = "rustls-provider-test"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR ISC OR MIT"
description = "Integration tests for Rustls cryptography providers"
publish = false

[dependencies]
hex = "0.4"
rustls = { path = "../rustls", package = "craftls", features = ["log"] }
rustls-aws-lc-rs = { path = "../rustls-aws-lc-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
